services:
  # FastAPI Backend Web Service
  - type: web
    name: landgov-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: landgov-db
          property: connectionString

  # React Vite Frontend Web Service (or Static Site)
  - type: web
    name: landgov-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 80

databases:
  - name: landgov-db
    plan: starter
    region: oregon
    databaseName: landgov
    user: landgov
