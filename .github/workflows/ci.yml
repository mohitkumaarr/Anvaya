name: LandGov AI — CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Build & Validate Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck and Build Bundle
        working-directory: ./frontend
        run: npm run build

  backend-check:
    name: Validate Backend & Database Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Syntax & Compilation Verification
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/models.py
          python -m py_compile backend/app/schemas.py
          python -m py_compile backend/seed.py

      - name: Validate Database Schema Migration & Seeding
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          DEMO_MODE: "true"
        run: |
          python backend/seed.py
          python -c "
          from backend.app.database import SessionLocal
          from backend.app import models
          db = SessionLocal()
          print('Users:', db.query(models.User).count())
          print('Documents:', db.query(models.Document).count())
          print('Datasets:', db.query(models.Dataset).count())
          assert db.query(models.User).count() >= 4
          assert db.query(models.Document).count() >= 30
          print('CI Schema & Seeding Verification: PASSED')
          "
